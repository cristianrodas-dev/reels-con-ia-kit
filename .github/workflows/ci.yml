# Revisa cada PR y cada push a main. No usa secretos ni llama a Instagram.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Sin secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            video/package-lock.json
      - name: Servidor MCP y API (raíz)
        run: |
          npm ci --ignore-scripts
          npm run typecheck
      - name: Plantilla de video (video/)
        working-directory: video
        run: |
          npm ci --ignore-scripts
          npm run typecheck

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compilar scripts
        run: python -m compileall -q guion
      - name: Tests
        run: python -m unittest discover -s guion/tests -v
